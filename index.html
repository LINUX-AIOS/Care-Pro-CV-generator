<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Care-Pro CV Generator</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<!-- html2canvas + jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  body { font-family: Arial, sans-serif; margin: 18px; background:#fff; color:#111; }
  .form-container, .cv-container {
    width: 210mm; padding: 18px; margin: 16px auto; background: #fff;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
  }
  input, textarea { width:100%; padding:8px; margin:8px 0; box-sizing:border-box; border:1px solid #ccc; border-radius:4px; }
  .btn { padding:10px 14px; background:#222; color:#fff; border:none; cursor:pointer; border-radius:6px; transition:0.2s; }
  .btn:hover { background:#444; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
  .header{text-align:center}
  .photo{width:120px;height:120px;border-radius:50%;object-fit:cover;margin-bottom:10px}
  h1{margin:4px 0}
  ul{list-style:none;padding-left:0;margin:6px 0}
  p, li { white-space: pre-wrap; }

  /* Background area (for base64 background) */
  #cv {
    position: relative;
    overflow: hidden;
  }
  #cv-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.15; /* adjust transparency */
    z-index: 0;
  }
  .cv-content {
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="form-container">
  <h2>Care-Pro CV Generator</h2>
  <input type="file" id="photoInput" accept="image/*">
  <input type="text" id="nameInput" placeholder="Full Name">
  <input type="text" id="iqamaInput" placeholder="Iqama Number">
  <input type="text" id="phoneInput" placeholder="Phone Number">
  <input type="text" id="emailInput" placeholder="Email">
  <input type="text" id="addressInput" placeholder="Address">
  <input type="text" id="jobInput" placeholder="Present Job">
  <textarea id="summaryInput" placeholder="Professional Summary"></textarea>
  <textarea id="educationInput" placeholder="Education (one per line)"></textarea>
  <textarea id="experienceInput" placeholder="Experience (one per line)"></textarea>
  <textarea id="skillsInput" placeholder="Skills (one per line)"></textarea>

  <button class="btn" onclick="generateCV()">Generate CV</button>
</div>

<div class="cv-container" id="cv" style="display:none;">
  <!-- Base64 background placeholder -->
  <img id="cv-bg" src="" alt="Background" />

  <div class="cv-content">
    <div class="header">
      <img id="photo" class="photo" src="https://via.placeholder.com/120" alt="photo">
      <h1 id="name"></h1>
      <div class="contact">
        <div><b>Iqama No:</b> <span id="iqama"></span></div>
        <div><b>Phone:</b> <span id="phone"></span></div>
        <div><b>Email:</b> <span id="email"></span></div>
        <div><b>Address:</b> <span id="address"></span></div>
        <div><b>Present Job:</b> <span id="job"></span></div>
      </div>
    </div>

    <h3>PROFESSIONAL SUMMARY</h3>
    <p id="summary"></p>

    <h3>EDUCATION</h3>
    <ul id="education"></ul>

    <h3>WORK EXPERIENCE</h3>
    <ul id="experience"></ul>

    <h3>SKILLS</h3>
    <ul id="skills"></ul>
  </div>
</div>

<div style="text-align:center;margin:14px;">
  <button class="btn" id="downloadBtn" style="display:none;" onclick="downloadAndUpload()">Download & Upload</button>
</div>

<script>
/* ---------- Firebase Config ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyAhcU8StPFajp6P1qOa3Qe4avdlEPpueRQ",
  authDomain: "carepro-cv.firebaseapp.com",
  projectId: "carepro-cv",
  storageBucket: "carepro-cv.appspot.com",
  messagingSenderId: "494275048602",
  appId: "1:494275048602:web:19735a3d6d80ab6430db23"
};
firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();

/* ---------- Generate CV ---------- */
function generateCV() {
  document.getElementById("cv").style.display = "block";
  document.getElementById("downloadBtn").style.display = "inline-block";

  const photoFile = document.getElementById("photoInput").files[0];
  if (photoFile) {
    const fr = new FileReader();
    fr.onload = e => document.getElementById("photo").src = e.target.result;
    fr.readAsDataURL(photoFile);
  }

  // Fill text fields
  const set = (id1, id2) => document.getElementById(id1).innerText = document.getElementById(id2).value || "";
  set("name", "nameInput"); set("iqama", "iqamaInput"); set("phone", "phoneInput");
  set("email", "emailInput"); set("address", "addressInput"); set("job", "jobInput");
  document.getElementById("summary").innerText = document.getElementById("summaryInput").value || "";

  document.getElementById("education").innerHTML = listify("educationInput");
  document.getElementById("experience").innerHTML = listify("experienceInput");
  document.getElementById("skills").innerHTML = listify("skillsInput");

  // 🔹 Optional: Add your base64 background here later
  // Example: document.getElementById("cv-bg").src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUg...";
}

function listify(id) {
  return document.getElementById(id).value.split("\n")
    .filter(x => x.trim() !== "")
    .map(x => `<li>${escapeHtml(x.trim())}</li>`).join("");
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- Download & Upload ---------- */
async function downloadAndUpload() {
  const btn = document.getElementById("downloadBtn");
  btn.disabled = true;
  btn.innerText = "Generating...";

  try {
    const iqama = (document.getElementById("iqama").innerText || "CV").trim();
    const cvEl = document.getElementById("cv");

    await new Promise(r => setTimeout(r, 200));
    const canvas = await html2canvas(cvEl, { scale: 2, useCORS: true });
    const imgData = canvas.toDataURL("image/png");

    const pdf = new window.jspdf.jsPDF("p", "mm", "a4");
    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);

    const pdfBlob = pdf.output("blob");
    const filename = sanitizeFilename(iqama) + ".pdf";
    triggerBrowserDownload(pdfBlob, filename);

    // Upload asynchronously
    const path = "cv/" + filename;
    const storageRef = storage.ref().child(path);
    const uploadTask = storageRef.put(pdfBlob);

    uploadTask.on('state_changed',
      snap => {
        const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
        btn.innerText = "Uploading... " + Math.round(pct) + "%";
      },
      err => {
        console.error("Upload failed:", err);
        alert("Upload failed: " + err.message);
        btn.innerText = "Download & Upload";
        btn.disabled = false;
      },
      async () => {
        const url = await storageRef.getDownloadURL();
        console.log("✅ Uploaded:", url);
        alert("✅ CV uploaded successfully for " + iqama);
        btn.innerText = "Download & Upload";
        btn.disabled = false;
      }
    );
  } catch (err) {
    console.error(err);
    alert("Error: " + err.message);
    btn.disabled = false;
    btn.innerText = "Download & Upload";
  }
}

function triggerBrowserDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

function sanitizeFilename(name){return name.replace(/[^a-z0-9_\-\.]/gi, '_');}
</script>
</body>
</html>
