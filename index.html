<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Care-Pro Fast CV Generator</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  body { font-family: Arial, sans-serif; background: #fff; padding: 20px; }
  .form-container {
    width: 210mm; margin: auto; background: #fff; padding: 18px;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
  }
  input, textarea { width:100%; padding:8px; margin:6px 0; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; }
  .btn { padding:10px 14px; background:#222; color:#fff; border:none; cursor:pointer; border-radius:6px; transition:0.2s; }
  .btn:hover { background:#444; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
</style>
</head>
<body>

<div class="form-container">
  <h2>Care-Pro Fast CV Generator</h2>
  <input type="file" id="photoInput" accept="image/*">
  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="iqama" placeholder="Iqama Number">
  <input type="text" id="phone" placeholder="Phone Number">
  <input type="text" id="email" placeholder="Email">
  <input type="text" id="address" placeholder="Address">
  <input type="text" id="job" placeholder="Present Job">
  <textarea id="summary" placeholder="Professional Summary"></textarea>
  <textarea id="education" placeholder="Education (one per line)"></textarea>
  <textarea id="experience" placeholder="Experience (one per line)"></textarea>
  <textarea id="skills" placeholder="Skills (one per line)"></textarea>
  <button class="btn" id="generateBtn" onclick="generateCV()">Generate & Upload</button>
</div>

<script>
/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyAhcU8StPFajp6P1qOa3Qe4avdlEPpueRQ",
  authDomain: "carepro-cv.firebaseapp.com",
  projectId: "carepro-cv",
  storageBucket: "carepro-cv.appspot.com",
  messagingSenderId: "494275048602",
  appId: "1:494275048602:web:19735a3d6d80ab6430db23"
};
firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();

/* ---------- Generate Fast PDF ---------- */
async function generateCV() {
  const btn = document.getElementById("generateBtn");
  btn.disabled = true;
  btn.innerText = "Generating...";

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const name = val("name");
  const iqama = val("iqama") || "CV";
  const phone = val("phone");
  const email = val("email");
  const address = val("address");
  const job = val("job");
  const summary = val("summary");
  const education = val("education");
  const experience = val("experience");
  const skills = val("skills");

  // Optional background base64 (placeholder now)
  // const bgBase64 = "data:image/png;base64,....";
  // doc.addImage(bgBase64, "PNG", 0, 0, 210, 297);

  // Add photo if uploaded
  const photoFile = document.getElementById("photoInput").files[0];
  if (photoFile) {
    const base64 = await fileToBase64(photoFile);
    doc.addImage(base64, "JPEG", 160, 10, 35, 35); // top-right
  }

  // Text layout
  doc.setFontSize(18);
  doc.text(name, 15, 25);
  doc.setFontSize(12);
  doc.text(`Iqama: ${iqama}`, 15, 35);
  doc.text(`Phone: ${phone}`, 15, 42);
  doc.text(`Email: ${email}`, 15, 49);
  doc.text(`Address: ${address}`, 15, 56);
  doc.text(`Present Job: ${job}`, 15, 63);

  let y = 75;
  y = addSection(doc, "PROFESSIONAL SUMMARY", summary, y);
  y = addSection(doc, "EDUCATION", education, y);
  y = addSection(doc, "EXPERIENCE", experience, y);
  y = addSection(doc, "SKILLS", skills, y);

  const blob = doc.output("blob");
  const filename = sanitize(iqama) + ".pdf";

  triggerDownload(blob, filename);
  uploadToFirebase(blob, filename, btn);
}

/* ---------- Helper Functions ---------- */
function val(id) { return document.getElementById(id).value.trim(); }
function sanitize(n){return n.replace(/[^a-z0-9_\-\.]/gi, '_');}
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function addSection(doc, title, content, y){
  doc.setFontSize(14);
  doc.text(title, 15, y);
  doc.setFontSize(11);
  const lines = doc.splitTextToSize(content.replace(/\n/g, " "), 180);
  doc.text(lines, 15, y+7);
  return y + 10 + lines.length * 5;
}
function fileToBase64(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/* ---------- Upload Asynchronously ---------- */
function uploadToFirebase(blob, filename, btn){
  btn.innerText = "Uploading...";
  const path = "cv/" + filename;
  const ref = storage.ref().child(path);
  const uploadTask = ref.put(blob);
  uploadTask.on("state_changed",
    snap => {
      const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
      btn.innerText = "Uploading " + Math.round(pct) + "%";
    },
    err => {
      alert("Upload failed: " + err.message);
      btn.disabled = false;
      btn.innerText = "Generate & Upload";
    },
    async () => {
      const url = await ref.getDownloadURL();
      alert("✅ CV uploaded successfully!");
      console.log("Uploaded:", url);
      btn.disabled = false;
      btn.innerText = "Generate & Upload";
    }
  );
}
</script>
</body>
</html>
