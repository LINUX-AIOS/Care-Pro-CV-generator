<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faizan CV Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
  .form-container, .cv-container { 
    width: 210mm; padding: 20px; margin: 20px auto; background: #fff; 
    box-shadow: 0 0 5px rgba(0,0,0,0.3); 
  }
  .cv-container { 
    background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAB5oAAArACAYAAABxoTBLAAAMS2lDQ1BJQ0MgUHJvZmlsZQAASImVVwdYkH8aZbjkK1mu32/IFHdYk77PkYZpSDKQYKAsDUvYkpsJO5sxBa7XozNmp6FIogyhg7CrmE5wVMnqjmNU6oRCzIwpn8zzt+HBlVJJdVfOpfsIIzMSDiSJGbmCodQKXEx0eGJ/Gnby1hgB9P3JI+Q4oWlHtpBYN7fdSxmmbzdK0s4sgoOAZK5xGAVJvhv/av/R3K47zWeSWrpMh2JaDolQ4Nq0T8Pf+HGesmLYK9gdQgMMi3AeyeVLJfrvaNYAIP2GuRB2JlfOi+m24Un5eG73/nTzDZvGZ8o5u/IW14ygNsY5CJH3lu+g2qq6qSlvhnHGqlO1oBcNjKfMhN3HvEfC5xAKvMdgrx5HYio2dLT3n8IcJXCWX3dJViKqATR3Cejozcwef4+FjTBtD/y2ELZJIK1bsGR8jEHks/On4Xp+xL+fJe4wi0cnnBbSEfNeg2nBzMhePDf3C6WwlCg0Uz/wBFj1q1RF28V6NYITJ8hlhnR8mBeDHPJIQXOnR+PkBnfB74bQljwUI/FGjSP3Yn9l1vwDlvDRNnU4hq0mNeU2E9gb+gUFtKs4Z3+Tu+U3IJFhtdAIMfhnyuLMgXz12/3TUtjPCzNMHFfgzkcksn8/lyDRYINbLvA6zpYatggOPh/e3JRKpGeW6R9Y2hGXodG9O2pRRDQ")
    no-repeat center/cover; 
    min-height: 297mm;
    padding-top: 50mm;
  }
  input, textarea { width: 100%; padding: 8px; margin: 8px 0; }
  .btn { margin-top: 10px; padding: 10px 15px; background: #333; color: #fff; border: none; cursor: pointer; }
  .header { text-align: center; }
  .photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
  h1 { margin: 5px 0; font-size: 28px; }
  .contact { font-size: 14px; margin-bottom: 20px; }
  h2 { background: #eee; padding: 5px; font-size: 18px; margin-top: 20px; }
  ul { list-style-type: none; padding-left: 0; margin: 5px 0 10px 0; }
  p, li { white-space: pre-wrap; }
</style>
</head>
<body>

<div class="form-container">
  <h2>Care-Pro CV Generator by Faizan</h2>
  <input type="file" id="photoInput" accept="image/*">
  <input type="text" id="nameInput" placeholder="Full Name">
  <input type="text" id="iqamaInput" placeholder="Iqama Number">
  <input type="text" id="phoneInput" placeholder="Phone Number">
  <input type="text" id="emailInput" placeholder="Email">
  <input type="text" id="addressInput" placeholder="Address">
  <input type="text" id="jobInput" placeholder="Present Job">
  <textarea id="summaryInput" placeholder="Professional Summary (multi-line supported)"></textarea>
  <textarea id="educationInput" placeholder="Education (one per line)"></textarea>
  <textarea id="experienceInput" placeholder="Experience (one per line)"></textarea>
  <textarea id="skillsInput" placeholder="Skills (one per line)"></textarea>
  <button class="btn" onclick="generateCV()">Generate CV</button>
</div>

<div class="cv-container" id="cv" style="display:none;">
  <div class="header">
    <img src="https://via.placeholder.com/120" class="photo" id="photo">
    <h1 id="name"></h1>
    <div class="contact">
      <div><b>Iqama No:</b> <span id="iqama"></span></div>
      <div><b>Phone:</b> <span id="phone"></span></div>
      <div><b>Email:</b> <span id="email"></span></div>
      <div><b>Address:</b> <span id="address"></span></div>
      <div><b>Present Job:</b> <span id="job"></span></div>
    </div>
  </div>

  <h2>PROFESSIONAL SUMMARY</h2>
  <p id="summary"></p>

  <h2>EDUCATION</h2>
  <ul id="education"></ul>

  <h2>WORK EXPERIENCE</h2>
  <ul id="experience"></ul>

  <h2>SKILLS</h2>
  <ul id="skills"></ul>
</div>

<button class="btn" id="downloadBtn" style="display:none;" onclick="downloadPDF()">Download as PDF</button>

<script>
function generateCV() {
  document.getElementById("cv").style.display = "block";
  document.getElementById("downloadBtn").style.display = "inline-block";

  const photoFile = document.getElementById("photoInput").files[0];
  if (photoFile) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById("photo").src = e.target.result;
    };
    reader.readAsDataURL(photoFile);
  }

  document.getElementById("name").innerText = document.getElementById("nameInput").value;
  document.getElementById("iqama").innerText = document.getElementById("iqamaInput").value;
  document.getElementById("phone").innerText = document.getElementById("phoneInput").value;
  document.getElementById("email").innerText = document.getElementById("emailInput").value;
  document.getElementById("address").innerText = document.getElementById("addressInput").value;
  document.getElementById("job").innerText = document.getElementById("jobInput").value;
  document.getElementById("summary").innerHTML = document.getElementById("summaryInput").value;

  let eduList = document.getElementById("educationInput").value.split("\n");
  document.getElementById("education").innerHTML = eduList.filter(e => e.trim() !== "").map(e => "<li>"+e.trim()+"</li>").join("");

  let expList = document.getElementById("experienceInput").value.split("\n");
  document.getElementById("experience").innerHTML = expList.filter(e => e.trim() !== "").map(e => "<li>"+e.trim()+"</li>").join("");

  let skillList = document.getElementById("skillsInput").value.split("\n");
  document.getElementById("skills").innerHTML = skillList.filter(s => s.trim() !== "").map(s => "<li>"+s.trim()+"</li>").join("");
}

async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const cv = document.getElementById("cv");
  const iqama = document.getElementById("iqamaInput").value.trim() || "Unknown";

  const canvas = await html2canvas(cv, { scale: 2 });
  const imgData = canvas.toDataURL("image/png");

  const pdf = new jsPDF("p", "mm", "a4");
  const imgProps = pdf.getImageProperties(imgData);
  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
  pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);

  // ✅ Download locally
  pdf.save(`${iqama}.pdf`);

  // ✅ Upload to Firebase
  const pdfBlob = pdf.output("blob");
  if (window.uploadToFirebase) {
    await window.uploadToFirebase(iqama, pdfBlob);
  }
}
</script>

<!-- 🔥 Firebase Upload Integration -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

  // 🚨 Replace this config with your Firebase project details
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);

  window.uploadToFirebase = async function(iqama, pdfBlob) {
    try {
      const fileRef = ref(storage, `cv/${iqama}.pdf`);
      await uploadBytes(fileRef, pdfBlob);
      const url = await getDownloadURL(fileRef);
      console.log("✅ Uploaded:", url);
      alert(`CV uploaded successfully for ${iqama}`);
    } catch (err) {
      console.error("❌ Upload failed:", err);
      alert("Upload failed — check console");
    }
  }
</script>

</body>
</html>
